    <!-- 1.1: программа тура приходит с другого адреса — соединение готовим заранее -->
    <link rel="preconnect" href="https://umra.jurt.kz" crossorigin />
    <!-- 1.1: тексты гида и программу для экрана «Сейчас» начинаем качать вместе со скриптом, а не после него.
         Язык — из настроек на телефоне (как в store.ts); адреса — как в src/lib/content.ts и src/lib/program.ts.
         Программу заранее берём только при первом открытии: если копия уже на телефоне (jurt.program), экран рисуется
         из неё, а свежую версию program.ts спрашивает сам, без кэша браузера. -->
    <script>
      (function () {
        function get(key) { try { return localStorage.getItem(key) || '' } catch (e) { return '' } }
        function preload(href) {
          var k = document.createElement('link')
          k.rel = 'preload'; k.as = 'fetch'; k.crossOrigin = 'anonymous'; k.href = href
          document.head.appendChild(k)
        }
        var l = get('jurt.lang')
        var dir = l === 'kk' || l === 'en' ? l + '/' : ''
        ;['steps', 'info', 'dua', 'zikr', 'modes'].forEach(function (n) { preload('/content/' + dir + n + '.json') })
        if (!get('jurt.program')) preload('https://umra.jurt.kz/program/program.json')
      })()
    </script>
